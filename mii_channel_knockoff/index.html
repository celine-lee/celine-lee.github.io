<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mii Studio — Mii Channel</title>
<style>
:root{
  --ink:#33383c;
  --rail-a:#b9c2c2; --rail-b:#96a1a1;      /* grey tab trough */
  --btn-a:#ffffff;  --btn-b:#dde2e2;        /* white plastic buttons */
  --btn-line:#7f8c8c;
  --accent:#d97a45; --accent-lt:#eda072; --accent-d:#a9521c;
  --tray:#c6d3d8; --tray-b:#b3c3c9; --tray-line:#8fa0a6;
  --tile-line:#94a3a8;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:#ccd4d4;
  color:var(--ink);
  font-family:"Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:16px 16px 40px}

/* ---------- tab rail, sitting on the content board ---------- */
.board{
  border-radius:var(--r);overflow:hidden;
  background:#eef3f4;                       /* open space the Mii stands in */
  border:1px solid #a1adae;
  box-shadow:0 7px 20px rgba(28,44,50,.17);
}
.railwrap{background:var(--rail-a);padding:0 6px;border-bottom:1px solid #97a4a4}
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 1 0;min-width:64px;height:56px;
  border-radius:0 0 10px 10px;
  display:grid;place-items:center;color:#48545a;
  background:#e4eaea;
  border:1px solid #a4afaf;border-top:none;
  transition:background .12s, color .12s;
}
.tab svg{width:32px;height:32px;stroke-width:1.8}
.tab:hover{background:#f1f5f5;color:#2f383c}
.tab.on{color:#fff;background:var(--accent);border-color:var(--accent-d)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(268px,330px) 1fr;gap:10px;padding:10px;align-items:start}
@media (max-width:880px){main{grid-template-columns:1fr}}

/* ---------- preview ---------- */
.stage{
  padding:0;position:sticky;top:16px;background:none;border:0;
}
.stage-art{
  background:none;border:0;overflow:visible;
}
#mii{display:block;width:100%;height:clamp(300px,48vh,436px)}
.stage-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.stage-bar .iconbtn{flex:none}
input.name{
  flex:1;min-width:0;padding:9px 13px;border:1px solid var(--btn-line);border-radius:9px;
  background:#fff;font-size:13px;
}
input.name:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,122,69,.3)}
.iconbtn{
  width:46px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;color:#3b4145;
  background:#f2f5f5;border:1px solid #a4afaf;
  transition:background .12s;
}
.iconbtn svg{width:25px;height:25px}
.iconbtn:hover{background:#fff}
.iconbtn:active{background:#e2e8e8}
.iconbtn.go{
  color:#fff;border-color:var(--accent-d);background:var(--accent);
}

/* ---------- options tray ---------- */
.panel{
  border-radius:var(--r);overflow:hidden;min-height:484px;
  background:var(--tray);border:1px solid #9aabb1;
  box-shadow:0 5px 14px rgba(28,44,50,.15);
}
.tray{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;padding:10px}
.tray--full{grid-template-columns:1fr}
.side-stack{display:grid;gap:11px;align-content:start}
@media (max-width:900px){.tray{grid-template-columns:1fr}}
.tray-main{min-width:0;display:grid;gap:9px}
.tray-side{min-width:0}

/* sub-category switch, as on the Wii */
.subs{display:flex;gap:6px}
.sub{
  flex:1;height:48px;border-radius:10px;display:grid;place-items:center;color:#3b4145;
  background:#f2f5f5;border:1px solid #a4afaf;transition:background .12s;
}
.sub svg{width:27px;height:27px}
.sub:hover{background:#fff}
.sub.on{color:#fff;border-color:var(--accent-d);background:var(--accent)}

.box{
  background:#e9eeee;border:1px solid #adb8b9;border-radius:10px;padding:8px;
}
.pager{display:flex;align-items:center;gap:4px}
.pager .grid{flex:none;grid-template-columns:repeat(2,104px);gap:7px}
.pg{
  flex:none;width:32px;padding:0;display:grid;place-items:center;
  background:none;border:0;box-shadow:none;color:var(--accent);
  transition:color .12s, transform .1s;
}
.pg svg{width:28px;height:28px}
.pg:hover{color:var(--accent-d);transform:scale(1.12)}
.pg:active{transform:scale(.96)}
.dots{display:flex;justify-content:center;gap:7px;margin-top:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;border:1px solid #adb8b9}
.dot.on{background:var(--accent);border-color:var(--accent-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,96px));gap:8px}
.tile{
  position:relative;aspect-ratio:1;padding:0;border-radius:9px;overflow:hidden;
  background:#fff;border:1px solid #adb8b9;
  display:grid;place-items:center;transition:border-color .12s, background .12s;
}
.tile svg{width:100%;height:100%;display:block}
.tile:hover{border-color:var(--accent)}
.tile.on{border-color:var(--accent-d);background:var(--accent)}

.sw-box{background:#fff;border:1px solid #adb8b9;border-radius:8px;padding:5px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,40px);gap:5px;justify-content:start}
.sw{
  aspect-ratio:1;border-radius:6px;border:1px solid rgba(0,0,0,.3);padding:0;
  transition:transform .1s;
}
.sw.wheel{
  position:relative;overflow:hidden;cursor:pointer;
  background:conic-gradient(#e5484d,#e2a336,#e5d94d,#5ec26a,#3aa7c9,#5b6ad4,#a457d6,#e5484d);
}
.sw.wheel input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
  opacity:0;border:0;padding:0;cursor:pointer}
.sw:hover{transform:scale(1.25)}
.sw.on{box-shadow:0 0 0 1px #fff, 0 0 0 2.5px var(--accent)}

/* ---------- icon-capped sliders ---------- */
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px 10px}
.sliders.big{grid-template-columns:1fr;gap:18px}
.sliders.big .slider{padding:22px 20px;gap:18px;border-radius:14px}
.sliders.big .cap{width:40px;height:40px;opacity:1;color:#42504f}
.sliders.big input[type=range]{height:24px;border-radius:12px}
.sliders.big input[type=range]::-webkit-slider-thumb{width:24px;height:48px;border-radius:9px}
.sliders.big input[type=range]::-moz-range-thumb{width:22px;height:46px;border-radius:9px}
.slider{
  display:flex;align-items:center;gap:12px;padding:14px 13px;border-radius:11px;
  background:#e9eeee;border:1px solid #adb8b9;
}
.slider .cap{flex:none;width:26px;height:26px;display:grid;place-items:center;color:#4d5a5e;opacity:.9}
.slider .cap svg{width:100%;height:100%}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:17px;border-radius:9px;
  background:linear-gradient(90deg, rgba(217,122,69,.38) var(--p,50%), #fff var(--p,50%));
  border:1px solid #adb8b9;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:17px;height:34px;border-radius:7px;cursor:grab;
  background:var(--accent);border:1px solid var(--accent-d);transition:transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scaleY(1.06)}
input[type=range]::-moz-range-thumb{
  width:15px;height:32px;border-radius:7px;cursor:grab;
  background:var(--accent);border:1px solid var(--accent-d);
}

/* ---------- Mii info page ---------- */
.profile{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;align-items:start}
.pf{
  border-radius:14px;padding:11px 13px 13px;
  background:#e8e6e1;border:1px solid #bab4ab;
}
.pf .lab{
  display:block;text-align:center;margin-bottom:8px;
  font-size:15px;font-weight:800;letter-spacing:.015em;color:#8b8379;
  text-shadow:0 1px 0 rgba(255,255,255,.95);
}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}
.pf--fill{align-self:stretch;display:flex;flex-direction:column}
.pf--fill .field{flex:1}
.pf--fill .fav-btn{flex:none}
@media (max-width:620px){.s1,.s2,.s3,.s4,.s5{grid-column:span 6}}
.field{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:44px;padding:9px 14px;border-radius:11px;
  font-size:18px;font-weight:700;color:#495450;text-align:center;
  background:#f4f2ee;border:1px solid #b6b0a7;
}
input.field, select.field{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
input.field:focus, select.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,122,69,.3)}
button.field{cursor:pointer;transition:filter .12s}
button.field:hover{background:#fbfaf8}
button.field:active{background:#e8e5e0}
.fav-btn{width:46px;height:46px;min-height:46px;padding:0;margin:0 auto;color:#c99a12;flex:none}
.fav-btn .star{display:grid;place-items:center;width:27px;height:27px;opacity:0;transition:opacity .12s}
.fav-btn.on .star{opacity:1}
.fav-btn svg{width:27px;height:27px}
.fav-btn.on{background:#f7e9b4;border-color:#c9b45f;color:#b8890c}
.bday{display:flex;align-items:center;gap:6px}
.bday .field{padding:7px 6px}
.bday .slash{font-weight:800;font-size:18px;color:#9a938a;flex:none}
.favgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:270px;margin:0 auto}
.fav{
  aspect-ratio:1;border-radius:5px;border:1px solid rgba(0,0,0,.3);padding:0;cursor:pointer;
  transition:transform .1s;
}
.fav:hover{transform:scale(1.12)}
.fav.on{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--accent)}

/* ---------- icon toggles ---------- */
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggle{
  width:54px;height:46px;border-radius:10px;display:grid;place-items:center;color:#3b4145;
  background:#f2f5f5;border:1px solid #a4afaf;transition:background .12s;
}
.toggle svg{width:26px;height:26px}
.toggle:hover{background:#fff}
.toggle.on{color:#fff;border-color:var(--accent-d);background:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="board">
    <div class="railwrap"><nav class="tabs" id="tabs"></nav></div>
    <main>
    <section class="stage">
      <div class="stage-art">
        <svg id="mii" viewBox="104 74 304 348" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="stage-bar">
        <button class="iconbtn" id="btnRandom" title="Surprise me" aria-label="Surprise me"></button>
        <button class="iconbtn" id="btnReset" title="Reset" aria-label="Reset"></button>
        <button class="iconbtn go" id="btnSave" title="Save PNG" aria-label="Save PNG"></button>
      </div>
    </section>
    <section class="panel" id="panel"></section>
    </main>
  </div>
</div>
<script>
/* ============================================================
   MII STUDIO  —  everything is SVG, everything is parametric
   ============================================================ */

const CX = 256;              // horizontal centre of the head
let LINE = '#3a3129';        // universal outline colour (swapped for mono tiles)
const INK_BASE = '#3a3129';

/* ---------------- palettes ---------------- */
const SKINS = ['#ffcfd6','#ffe2c8','#f8caa4','#edad7c','#dd9159','#c47540','#a45c2d','#7f451f','#582d13'];
const HAIRC = ['#241d17','#3d2a1c','#5b3a22','#7a4a24','#9c6b3d',
               '#c08b4a','#dcae5f','#eed08a','#e6e8ea'];
const EYEC  = ['#2c2a28','#5b3a22','#8a6a34','#3f7a4a','#2f6ea8','#6a6f75'];
const MOUTHC= ['#c9553f','#d96a5a','#e07d7d','#b8404a','#8e3550','#d4788e','#a94c6b','#6d3a3a'];
const SHIRTC= ['#d0243c','#ff6600','#ffd400','#a4d820','#009a3d','#00a0e9',
               '#003cb4','#ff87b0','#7a26a0','#8c5a2b','#f2f4f6','#333a3f'];
const GLASSC= ['#2c2a28','#5b3a22','#8a6a34','#2f6ea8','#a83030','#b0b6bc','#d4a017','#c46aa0'];
const PANTSC= ['#3f5f92','#26304a','#2b3138','#5d6873','#8f7f61','#6b4a2f','#4a5c3a','#c9cdd2','#8c3a3a','#5a3d6b'];
const SHOEC = ['#f2f4f6','#2b3138','#c0392b','#2f6ea8','#6b4423','#8c959e','#2e7d5b','#d0699a'];
const FAV_PANTS = '#c25a24';   // the rust orange worn in the reference photo
const HATC  = ['#d0243c','#ff6600','#ffd400','#2e7d5b','#00a0e9','#2f4f8f',
               '#7a26a0','#d0699a','#8c5a2b','#f2f4f6','#8c959e','#2b3138'];   // the rust orange worn in the reference photo

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
/* Colour slots hold either a palette index or a literal hex from the wheel. */
const pick = (list, v) => typeof v === 'string' ? v : list[clamp(Math.round(+v)||0, 0, list.length-1)];

/* ============================================================
   FACE — generated from parameters so every shape stays smooth
   ============================================================ */
const FACES = [
  {n:'Oval',    tY:120, tW:88,  cW:106, cY:236, jW:92,  jY:318, chW:34, chY:388},
  {n:'Round',   tY:118, tW:98,  cW:113, cY:246, jW:105, jY:322, chW:50, chY:384},
  {n:'Square',  tY:122, tW:95,  cW:108, cY:228, jW:105, jY:338, chW:68, chY:382},
  {n:'Pointed', tY:120, tW:88,  cW:104, cY:228, jW:82,  jY:312, chW:16, chY:394},
  {n:'Broad',   tY:126, tW:92,  cW:113, cY:252, jW:109, jY:330, chW:54, chY:380},
  {n:'Narrow',  tY:118, tW:78,  cW:94,  cY:238, jW:80,  jY:318, chW:30, chY:390},
  {n:'Heart',   tY:118, tW:99,  cW:111, cY:222, jW:80,  jY:314, chW:22, chY:390},
  {n:'Long',    tY:110, tW:84,  cW:100, cY:242, jW:88,  jY:340, chW:38, chY:408},
  {n:'Bread',   tY:120, tW:97,  cW:111, cY:250, jW:103, jY:332, chW:58, chY:386},
  {n:'Diamond', tY:126, tW:74,  cW:113, cY:250, jW:84,  jY:322, chW:24, chY:390},
  {n:'Chubby',  tY:124, tW:100, cW:117, cY:256, jW:112, jY:328, chW:62, chY:378},
  {n:'Chiseled',tY:118, tW:90,  cW:105, cY:232, jW:99,  jY:334, chW:44, chY:392}
];

function faceGeom(m){
  const f = FACES[m.face.shape];
  const w = m.face.width, j = m.face.jaw;
  return {
    tY:f.tY, tW:f.tW*w, cW:f.cW*w, cY:f.cY,
    jW:f.jW*w*j, jY:f.jY, chW:f.chW*w*j, chY:f.chY
  };
}
function facePath(g){
  const L=w=>CX-w, R=w=>CX+w;
  const a=(g.cY-g.tY), b=(g.jY-g.cY), c=(g.chY-g.jY);
  return [
    `M ${CX} ${g.tY}`,
    `C ${L(g.tW)} ${g.tY}, ${L(g.cW)} ${g.tY+a*0.34}, ${L(g.cW)} ${g.cY}`,
    `C ${L(g.cW)} ${g.cY+b*0.44}, ${L(g.jW)} ${g.jY-b*0.32}, ${L(g.jW)} ${g.jY}`,
    `C ${L(g.jW)} ${g.jY+c*0.5}, ${L(g.chW)} ${g.chY}, ${CX} ${g.chY}`,
    `C ${R(g.chW)} ${g.chY}, ${R(g.jW)} ${g.jY+c*0.5}, ${R(g.jW)} ${g.jY}`,
    `C ${R(g.jW)} ${g.jY-b*0.32}, ${R(g.cW)} ${g.cY+b*0.44}, ${R(g.cW)} ${g.cY}`,
    `C ${R(g.cW)} ${g.tY+a*0.34}, ${R(g.tW)} ${g.tY}, ${CX} ${g.tY}`,
    'Z'
  ].join(' ');
}

/* ============================================================
   HAIR — each entry returns an SVG fragment.
   back()  draws behind the head, front() draws over it.
   ============================================================ */
const CAP = 'M 148 264 C 141 168, 190 110, 256 110 C 322 110, 371 168, 364 264 '
          + 'C 357 214, 336 180, 256 180 C 176 180, 155 214, 148 264 Z';

function shade(hex, amt){                    // lighten (+) / darken (-) a hex colour
  const n = parseInt(hex.slice(1),16);
  const f = v => clamp(Math.round(v + 255*amt), 0, 255);
  return '#' + [f(n>>16&255), f(n>>8&255), f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

const HAIRS = [
  {n:'Bald', front:c=>``},

  {n:'Buzz', front:c=>`<path d="M 147 266 C 140 170, 190 112, 256 112 C 322 112, 372 170, 365 266
     C 357 218, 334 188, 256 188 C 178 188, 155 218, 147 266 Z" fill="${c}"/>`},

  {n:'Crew', front:c=>`<path d="${CAP}" fill="${c}"/>
     <path d="M 176 186 C 200 168, 312 168, 336 186 C 312 176, 200 176, 176 186 Z" fill="${shade(c,.07)}"/>`},

  {n:'Spiky', front:c=>`<path d="M 148 268 C 141 190, 168 136, 200 126 L 196 92 L 226 120 L 232 84
     L 258 118 L 272 86 L 292 122 L 320 100 L 320 132 C 352 152, 371 196, 364 268
     C 357 216, 336 182, 256 182 C 176 182, 155 216, 148 268 Z" fill="${c}"/>`},

  {n:'Side Part', front:c=>`<path d="M 148 268 C 141 168, 190 108, 256 108 C 326 108, 372 168, 364 268
     C 358 218, 340 186, 300 180 C 268 176, 214 206, 186 224 C 168 236, 156 252, 148 268 Z" fill="${c}"/>
     <path d="M 300 180 C 268 176, 214 206, 186 224 C 226 200, 268 188, 302 190 Z" fill="${shade(c,.08)}"/>`},

  {n:'Bowl', front:c=>`<path d="M 144 250 C 138 156, 190 104, 256 104 C 322 104, 374 156, 368 250
     L 368 214 C 340 196, 172 196, 144 214 Z" fill="${c}"/>
     <path d="M 144 214 C 172 196, 340 196, 368 214 L 368 250 C 366 226, 356 214, 256 214
     C 156 214, 146 226, 144 250 Z" fill="${c}"/>`},

  {n:'Messy', front:c=>`<path d="M 146 270 C 138 176, 186 106, 256 106 C 328 106, 374 176, 366 270
     C 360 234, 348 206, 330 198 Q 314 220 300 196 Q 284 220 266 194 Q 248 218 230 194
     Q 212 218 194 198 C 170 210, 152 236, 146 270 Z" fill="${c}"/>`},

  {n:'Slick', front:c=>`<path d="M 148 266 C 136 154, 186 96, 250 94 C 292 92, 318 108, 322 96
     C 340 108, 372 158, 364 266 C 356 208, 336 180, 256 180 C 184 180, 158 210, 148 266 Z" fill="${c}"/>
     <path d="M 172 176 C 196 138, 268 116, 330 122" fill="none" stroke="${shade(c,.15)}"
       stroke-width="8" stroke-linecap="round"/>
     <path d="M 176 202 C 202 164, 272 142, 340 150" fill="none" stroke="${shade(c,.1)}"
       stroke-width="7" stroke-linecap="round"/>
     <path d="M 186 224 C 212 190, 282 170, 348 180" fill="none" stroke="${shade(c,.07)}"
       stroke-width="6" stroke-linecap="round"/>`},

  {n:'Afro', front:c=>`<path d="M 256 76 C 172 76, 116 134, 116 208 C 116 258, 140 292, 172 300
     C 168 264, 176 214, 256 214 C 336 214, 344 264, 340 300 C 372 292, 396 258, 396 208
     C 396 134, 340 76, 256 76 Z" fill="${c}"/>
     <circle cx="168" cy="150" r="34" fill="${c}"/><circle cx="344" cy="150" r="34" fill="${c}"/>
     <circle cx="212" cy="104" r="34" fill="${c}"/><circle cx="300" cy="104" r="34" fill="${c}"/>
     <circle cx="256" cy="92"  r="34" fill="${c}"/>
     <circle cx="140" cy="214" r="30" fill="${c}"/><circle cx="372" cy="214" r="30" fill="${c}"/>`},

  {n:'Curly', front:c=>`<path d="${CAP}" fill="${c}"/>
     <circle cx="168" cy="176" r="26" fill="${c}"/><circle cx="214" cy="140" r="30" fill="${c}"/>
     <circle cx="256" cy="124" r="30" fill="${c}"/><circle cx="298" cy="140" r="30" fill="${c}"/>
     <circle cx="344" cy="176" r="26" fill="${c}"/><circle cx="150" cy="222" r="22" fill="${c}"/>
     <circle cx="362" cy="222" r="22" fill="${c}"/>`},

  {n:'Long', back:c=>`<path d="M 152 200 C 136 300, 138 420, 154 486 L 208 486 C 194 416, 192 300, 196 232 Z
     M 360 200 C 376 300, 374 420, 358 486 L 304 486 C 318 416, 320 300, 316 232 Z" fill="${c}"/>
     <path d="M 150 210 C 140 320, 146 420, 158 486 L 354 486 C 366 420, 372 320, 362 210 Z" fill="${shade(c,-.05)}"/>`,

    const COLS = 19, ROWS = 14;
    let d = '';
    for(let r = 0; r < ROWS; r++){
      for(let q = 0; q < COLS; q++){
        const jx = ((r*7 + q*13) % 5) - 2, jy = ((r*11 + q*5) % 5) - 2;
        const x  = 124 + q*15 + (r % 2 ? 7.5 : 0) + jx;
        const y  = g.cY + 8 + r*13 + jy;
        /* Top edge traces a real beard line: high at the sideburn, sweeping down
           across the cheek, then flat along the upper lip. */
        const t    = Math.min(1, Math.max(0, (Math.abs(x - CX) - 34) / 66));
        const yTop = (g.noseY + 18) - Math.pow(t, 1.6) * ((g.noseY + 18) - (g.cY + 16));
        if(y < yTop) continue;
        const lx = (x - g.mouthX) / 31, ly = (y - g.mouthY) / 14;
        if(lx*lx + ly*ly < 1) continue;                    // lips stay bare
        const rr = 1.8 + ((r*3 + q*7) % 3) * 0.4;
        d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}"/>`;
      }
    }
    return `<g fill="${c}" opacity=".8">${d}</g>`;
  }}
];

/* ============================================================
   BODY PROPORTIONS  —  one source of truth so svgMii() and the
   stage viewBox always agree on where the feet end up.
   ============================================================ */
function bodyGeom(m){
  const bw = m.body.build, bh = m.body.height;
  const shoulderY = 392;                    // head sits straight on the body, almost no neck
  const waistY    = shoulderY + 172*bh;
  const hipY      = waistY + 12*bh;
  const legBotY   = hipY + 116*bh;
  return {
    bw, bh, shoulderY, waistY, hipY, legBotY,
    shoulderHalf: 74*bw,                    // ~69% of head width, as in the reference
    waistHalf:    68*bw,
    hipHalf:      64*bw,                    // narrower than the shirt waist, so it hides behind it
    armW:         17*bw,
    handR:        22*bw,
    legW:         26*bw,
    legTopX:      38*bw,                    // legs emerge at the full width of the hips
    legBotX:      44*bw,
    footR:        29*bw,
    bottom: legBotY + 29*bw + 30
  };
}

const DEFAULT = () => ({

const get=(o,p)=>p.split('.').reduce((a,k)=>a[k],o);
const set=(o,p,v)=>{const k=p.split('.');const l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v;};
let M = DEFAULT();
let uidN = 0;

/* ============================================================
   RENDER
   ============================================================ */
function svgMii(m, mono){
  const uid = 'u'+(uidN++);
  const g   = faceGeom(m);
  const inv = mono === 2;                       // white line art, for a selected tile
  const INV_INK = '#fffffe';        // reads as white; dodges the knockout pass at the end
  LINE = mono ? (inv ? INV_INK : '#33383c') : INK_BASE;
  const INK = inv ? INV_INK : '#33383c';
  const skin= mono ? (inv ? 'none' : '#ffffff') : pick(SKINS, m.skin);
  const hc  = mono ? INK : pick(HAIRC, m.hair.color);
  const bwc = mono ? INK : pick(HAIRC, m.brows.color);
  const fhc = mono ? INK : pick(HAIRC, m.beard.color);
  const ec  = mono ? (inv ? 'none' : '#3d4247') : pick(EYEC, m.eyes.color);
  const mc  = mono ? (inv ? 'none' : '#ffffff') : pick(MOUTHC, m.mouth.color);
  const gc  = mono ? INK : pick(GLASSC, m.glasses.color);
  const sc  = mono ? (inv ? 'none' : '#ffffff') : pick(SHIRTC, m.body.color);
  const fp = facePath(g);
  const hair=HAIRS[m.hair.style], beard=BEARDS[m.beard.style], must=MUSTACHES[m.beard.must];

  const eyeY=262+m.eyes.y,  eyeSp=36+m.eyes.spacing;
  const browY=220+m.brows.y, browSp=40+m.brows.spacing;
  const noseY=302+m.nose.y,  noseX =CX+m.nose.x;
  const mouthY=344+m.mouth.y, mouthX=CX+m.mouth.x;
  const mustY=mouthY-21+m.beard.y;

  /* mirrored pair helper — local +x always points toward the nose */
  const pair=(inner,y,sp,sx,sy,rot)=>
    `<g transform="translate(${CX-sp},${y}) scale(${sx},${sy}) rotate(${rot})">${inner}</g>`+
    `<g transform="translate(${CX+sp},${y}) scale(${-sx},${sy}) rotate(${rot})">${inner}</g>`;

  /* ---- body: shaded torso + limbs, spherical hands / feet ---- */
  const b  = bodyGeom(m);
  const pc = mono ? (inv ? 'none' : '#ffffff') : (m.favorite ? FAV_PANTS : pick(PANTSC, m.body.pants));
  const J  = m.jewel;
  const jc = mono ? LINE : pick(JEWELC, J.color);
  const shc = mono ? (inv ? 'none' : '#ffffff') : pick(SHOEC, m.body.shoes);
  const g3 = mono ? 'none' : `url(#b3${uid})`;
  const edge = mono ? `stroke="${LINE}" stroke-width="4"` : 'stroke="rgba(0,0,0,.07)" stroke-width="2"';                       // single light source across the whole body

  const sph = (cx,cy,r,fill) => mono
    ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${LINE}" stroke-width="4"/>`
    : `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r}" fill="${fill}"/>
       <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r}" fill="url(#sp${uid})"/>`;
  const tube = (d,w,fill) => fill === 'none' ? '' :
    (mono ? `<path d="${d}" stroke="${LINE}" stroke-width="${w*2+4}" stroke-linecap="round" fill="none"/>` : '')
    + `<path d="${d}" stroke="${fill}" stroke-width="${w*2}" stroke-linecap="round" fill="none"/>`;

  const armTopX = b.shoulderHalf*0.84, armTopY = b.shoulderY + 26;
  const handX   = b.shoulderHalf + 50*b.bw, handY = b.waistY + 4;   // ~22 degrees from vertical
  const armL = `M ${CX-armTopX} ${armTopY} L ${CX-handX} ${handY}`;
  const armR = `M ${CX+armTopX} ${armTopY} L ${CX+handX} ${handY}`;
  const legL = `M ${CX-b.legTopX} ${b.hipY-16} L ${CX-b.legBotX} ${b.legBotY}`;
  const legR = `M ${CX+b.legTopX} ${b.hipY-16} L ${CX+b.legBotX} ${b.legBotY}`;

  const hipsD =
    `M ${CX-b.waistHalf} ${b.waistY-12} L ${CX+b.waistHalf} ${b.waistY-12}
     Q ${CX+b.hipHalf} ${b.waistY+4}, ${CX+b.hipHalf-5} ${b.hipY+12}
     L ${CX-b.hipHalf+5} ${b.hipY+12}
     Q ${CX-b.hipHalf} ${b.waistY+4}, ${CX-b.waistHalf} ${b.waistY-12} Z`;
  const dressD =
    `M ${CX-b.shoulderHalf} ${b.shoulderY+30}
     Q ${CX-b.shoulderHalf} ${b.shoulderY-1}, ${CX-b.shoulderHalf+24} ${b.shoulderY-4}
     L ${CX+b.shoulderHalf-24} ${b.shoulderY-4}
     Q ${CX+b.shoulderHalf} ${b.shoulderY-1}, ${CX+b.shoulderHalf} ${b.shoulderY+30}
     C ${CX+b.shoulderHalf+4} ${b.waistY-6}, ${CX+b.hipHalf+30} ${b.hipY+6}, ${CX+b.hipHalf+38} ${b.hipY+30}
     Q ${CX} ${b.hipY+50}, ${CX-b.hipHalf-38} ${b.hipY+30}
     C ${CX-b.hipHalf-30} ${b.hipY+6}, ${CX-b.shoulderHalf-4} ${b.waistY-6}, ${CX-b.shoulderHalf} ${b.shoulderY+30} Z`;
  const shirtD =
    `M ${CX-b.shoulderHalf} ${b.shoulderY+30}
     Q ${CX-b.shoulderHalf} ${b.shoulderY-1}, ${CX-b.shoulderHalf+24} ${b.shoulderY-4}
     L ${CX+b.shoulderHalf-24} ${b.shoulderY-4}
     Q ${CX+b.shoulderHalf} ${b.shoulderY-1}, ${CX+b.shoulderHalf} ${b.shoulderY+30}
     L ${CX+b.waistHalf} ${b.waistY+6} L ${CX-b.waistHalf} ${b.waistY+6} Z`;

  const groundShadow = mono ? ''
    : `<ellipse cx="${CX}" cy="${b.legBotY + b.footR*1.30}" rx="${b.legBotX + b.footR*1.45}"
         ry="${b.footR*0.42}" fill="rgba(28,44,50,.20)" filter="url(#gs${uid})"/>`;

  const body =
      groundShadow
    + tube(armL,b.armW,sc) + tube(armR,b.armW,sc)                 // arms, behind the torso
    + tube(armL,b.armW,g3) + tube(armR,b.armW,g3)
    + tube(legL,b.legW,pc) + tube(legR,b.legW,pc)                 // thighs, behind the hips
    + tube(legL,b.legW,g3) + tube(legR,b.legW,g3)
    + (m.body.dress ? '' : `<path d="${hipsD}" fill="${pc}" ${edge}/><path d="${hipsD}" fill="${g3}"/>`)
    + `<path d="${m.body.dress ? dressD : shirtD}" fill="${sc}" ${edge}/>`
    + `<path d="${m.body.dress ? dressD : shirtD}" fill="${g3}"/>`
    + (mono ? '' : `<path d="M ${CX-30} ${b.shoulderY-2} Q ${CX} ${b.shoulderY+24} ${CX+30} ${b.shoulderY-2}"
             fill="none" stroke="rgba(0,0,0,.15)" stroke-width="7" stroke-linecap="round"/>`)
    + sph(CX-handX, handY, b.handR, sc) + sph(CX+handX, handY, b.handR, sc)
    + sph(CX-b.legBotX, b.legBotY+b.footR*0.46, b.footR, shc)
    + sph(CX+b.legBotX, b.legBotY+b.footR*0.46, b.footR, shc);

  const chinY = 254 + (g.chY - 254) * m.face.size;      // chin in body space
  const neckwear =
      (J.choker ? `<path d="M ${CX-33} ${chinY-2} Q ${CX} ${chinY+17} ${CX+33} ${chinY-2}"
         fill="none" stroke="${jc}" stroke-width="7" stroke-linecap="round"/>` : '')
    + (J.necklace ? `<path d="M ${CX-39} ${chinY+1} Q ${CX} ${chinY+38} ${CX+39} ${chinY+1}"
         fill="none" stroke="${jc}" stroke-width="3.4"/>
       <circle cx="${CX}" cy="${chinY+40}" r="6.2" fill="${jc}"/>` : '');

  const neck =
    `<path d="M ${CX-28} ${g.chY-60} L ${CX-28} ${b.shoulderY+22} L ${CX+28} ${b.shoulderY+22} L ${CX+28} ${g.chY-60} Z" fill="${skin}"/>
     ${mono?'':`<ellipse cx="${CX}" cy="${g.chY-8}" rx="30" ry="15" fill="rgba(0,0,0,.11)"/>`}`;

  /* ---- head ---- */
  const earX = g.cW*0.74 + g.jW*0.26 + 6, earY = g.cY + 32;
  const ear = sx =>
    `<g transform="translate(${CX+sx*earX},${earY}) scale(${sx},1)">
       <ellipse rx="14" ry="21" fill="${skin}" stroke="${mono?LINE:'rgba(0,0,0,.10)'}" stroke-width="${mono?4:1.8}"/>
       <path d="M 3 -10 C -5 -8, -6 6, 2 11" fill="none" stroke="${mono?LINE:'rgba(0,0,0,.13)'}" stroke-width="${mono?3:2.4}" stroke-linecap="round"/>
     </g>`;
  const ears = ear(-1) + ear(1);

  const face = mono
    ? `<path d="${fp}" fill="${inv?'none':'#fff'}" stroke="${LINE}" stroke-width="4.5"/>`
    : `<path d="${fp}" fill="${skin}"/>
       <path d="${fp}" fill="url(#sh${uid})"/>`;

  const brows = pair(BROWS[m.brows.style].d(bwc), browY, browSp, m.brows.size, m.brows.size, m.brows.rot);
  const eyes  = pair(EYES[m.eyes.style].d(ec), eyeY, eyeSp, m.eyes.size, m.eyes.size*m.eyes.stretch, m.eyes.rot);
  const nw = m.nose.width;
  const nose  = `<g transform="translate(${noseX},${noseY}) scale(${m.nose.size*nw},${m.nose.size})">`
              + NOSES[m.nose.style].d(4 / Math.sqrt(nw)) + `</g>`;   // keep the line weight even when stretched
  const mouth = `<g transform="translate(${mouthX},${mouthY}) scale(${m.mouth.size*m.mouth.stretch},${m.mouth.size})">${MOUTHS[m.mouth.style].d(mc)}</g>`;
  const stache= must.d ? `<g transform="translate(${mouthX},${mustY}) scale(${m.beard.size})">${must.d(fhc)}</g>` : '';

  const bg = Object.assign({}, g, {mouthY, mouthX, noseY, noseX, earY, fp});
  const beardClip = beard.clip ? `<g clip-path="url(#fc${uid})">${beard.clip(fhc,bg,skin)}</g>` : '';
  const beardFree = beard.free ? beard.free(fhc,bg,skin) : '';

  const NOGLOSS = new Set(['Bald','Mohawk','Slick','Side Part','Afro Puffs','Loose Curls','Tapered']);
  const gloss = NOGLOSS.has(hair.n) ? ''
    : `<path d="M 192 157 C 218 130, 266 123, 303 139" fill="none" stroke="${shade(hc,.13)}"
         stroke-width="10" stroke-linecap="round" opacity=".8"/>`;
  /* Hair art was drawn against a reference skull: 106 half-width at the cheeks,
     88 at the crown control. Fit to whichever of those the live skull stretches
     more, and anchor the scale near the crown so shrinking cannot expose it. */
  const HAIR_ANCHOR = 138;
  const fit    = Math.max(g.cW / 106, g.tW / 88);
  const hairSX = fit * 1.04 * (0.62 + 0.38 * m.hair.size);   // width tracks the skull; Size mostly adds volume
  const hairSY = m.hair.size * Math.max(1, fit * 0.88);
  const hairT  = `translate(${CX},${HAIR_ANCHOR+m.hair.y}) scale(${m.hair.flip?-hairSX:hairSX},${hairSY}) translate(${-CX},${-HAIR_ANCHOR})`;
  const hairBack  = hair.back  ? `<g transform="${hairT}">${hair.back(hc)}</g>`  : '';
  const hairFront = hair.front ? `<g transform="${hairT}">${hair.front(hc)}${gloss}</g>` : '';

  const onEar = (sx, d) => `<g transform="translate(${CX+sx*earX},${earY}) scale(${sx},1)">${d}</g>`;
  const earJewel =
      (J.cartL ? onEar(-1, JEWEL_EAR.cart(jc)) : '') + (J.cartR ? onEar(1, JEWEL_EAR.cart(jc)) : '')
    + (J.studL ? onEar(-1, JEWEL_EAR.stud(jc)) : '') + (J.studR ? onEar(1, JEWEL_EAR.stud(jc)) : '')
    + (J.dropL ? onEar(-1, JEWEL_EAR.drop(jc)) : '') + (J.dropR ? onEar(1, JEWEL_EAR.drop(jc)) : '');

  const hatSpec = HATS[m.hat.style];
  const hatT = `translate(${CX},${HAIR_ANCHOR}) scale(${fit*1.04},${Math.max(1, fit*0.88)}) translate(${-CX},${-HAIR_ANCHOR})`;
  const hatC = mono ? (inv ? 'none' : '#fff') : pick(HATC, m.hat.color);
  const hatA = mono ? (inv ? 'none' : '#fff') : shade(pick(HATC, m.hat.color), -.17);
  const hat = hatSpec.d
    ? `<g transform="${hatT}" ${mono ? `stroke="${LINE}" stroke-width="4" stroke-linejoin="round"` : ''}>`
      + hatSpec.d(hatC, hatA) + `</g>` : '';

  const glass = GLASSES[m.glasses.style].d
    ? `<g transform="translate(${CX},${eyeY+m.glasses.y}) scale(${m.glasses.size})">${GLASSES[m.glasses.style].d(gc)}</g>` : '';
  const mole = m.mole.on
    ? `<ellipse cx="${mouthX+40+m.mole.x}" cy="${mouthY-22+m.mole.y}" rx="${5*m.mole.size}" ry="${5*m.mole.size}" fill="#5a4030"/>` : '';

  const headScale = t =>
    `<g transform="translate(${CX},254) scale(${m.face.size}) translate(${-CX},-254)">${t}</g>`;
  /* The 24 hand-drawn caps cannot each fit 12 skull shapes at every size, so the
     crown of the skull is filled in hair colour underneath. Clipped above the
     style's hairline, it is invisible except where a cap would have fallen short. */
  const scalpOn = !!hair.front && hair.n !== 'Mohawk';
  const scalpY  = hair.hl != null ? hair.hl : 180;
  const scalpCY = (g.tY + g.chY) / 2;
  const scalp = scalpOn
    ? `<g clip-path="url(#cp${uid})"><path d="${fp}" fill="${hc}"
         transform="translate(${CX},${scalpCY}) scale(1.03) translate(${-CX},${-scalpCY})"/></g>`
    : '';
  const backHair = hairBack ? headScale(hairBack) : '';
  const head = headScale(
      ears + face + scalp + beardClip + beardFree +
      brows + eyes + nose + mouth + stache +
      hairFront + earJewel + hat + glass + mole);

  const out = `<defs>
<linearGradient id="sh${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#fff" stop-opacity=".16"/>
        <stop offset="62%"  stop-color="#fff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".055"/>
      </linearGradient>
      <linearGradient id="b3${uid}" gradientUnits="userSpaceOnUse" x1="${CX-165}" y1="0" x2="${CX+175}" y2="0">
        <stop offset="0%"   stop-color="#fff" stop-opacity=".13"/>
        <stop offset="34%"  stop-color="#fff" stop-opacity=".07"/>
        <stop offset="64%"  stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".11"/>
      </linearGradient>
      <radialGradient id="sp${uid}" cx="35%" cy="30%" r="82%">
        <stop offset="0%"   stop-color="#fff" stop-opacity=".2"/>
        <stop offset="58%"  stop-color="#fff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".1"/>
      </radialGradient>
      <filter id="gs${uid}" x="-60%" y="-180%" width="220%" height="460%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
      <clipPath id="fc${uid}"><path d="${fp}"/></clipPath>
      <clipPath id="cp${uid}"><path d="M 0 0 H 512 V 254
        C 340 254, 300 ${scalpY} 256 ${scalpY}
        C 212 ${scalpY}, 172 254, 0 254 Z"/></clipPath>
    </defs>${backHair}${neck}${body}${neckwear}${head}`;
  LINE = INK_BASE;                              // never leak the mono ink into the live Mii
  // only the parts library's own hard-coded paper white (sclera, teeth) is knocked out
  return inv ? out.replace(/fill="#fff(?:fff)?"(?![0-9a-f])/gi, 'fill="none"') : out;
}

  figShort: fig('<circle cx="12" cy="7.6" r="3.2"/><rect x="9.4" y="11.4" width="5.2" height="5.4" rx="1.8"/><rect x="9.6" y="16.4" width="2" height="3.4" rx="1"/><rect x="12.4" y="16.4" width="2" height="3.4" rx="1"/>'),
  figTall : fig('<circle cx="12" cy="3.2" r="2.9"/><rect x="9.5" y="6.6" width="5" height="6.6" rx="1.8"/><rect x="9.7" y="12.8" width="2" height="7.6" rx="1"/><rect x="12.3" y="12.8" width="2" height="7.6" rx="1"/>'),
  dress : si('<path d="M9.3 3.5h5.4l1.4 3.2-1.2 2 4.1 11.8H5l4.1-11.8-1.2-2z"/>'),
  star  : si('<path d="M12 3.6l2.6 5.4 5.9.85-4.25 4.15 1 5.9L12 17.05 6.75 19.9l1-5.9L3.5 9.85l5.9-.85z" fill="currentColor"/>'),
  stache: si('<path d="M12 9.5c2.6-2.8 8.5-2.6 8.5 1.8 0 2.8-4.8 3.6-8.5-.4-3.7 4-8.5 3.2-8.5.4C3.5 6.9 9.4 6.7 12 9.5z"/>')
};

/* slider end-caps are derived from what the slider actually does */
function caps(path){
  if(path === 'body.build')  return [SI.figThin, SI.figWide];
  if(path === 'body.height') return [SI.figShort, SI.figTall];
  if(path === 'face.width')  return [SI.browNarrow, SI.browWide];   // skull width at the brow
  if(path === 'face.jaw')    return [SI.jawNarrow, SI.jawWide];
  if(path === 'nose.width')  return [SI.noseNarrow, SI.noseWide];
  const k = path.split('.').pop();
  if(k==='size')                       return [SI.small, SI.big];
  if(k==='width'||k==='jaw'||k==='build') return [SI.narrow, SI.wide];
  if(k==='height')                     return [SI.squat, SI.tall];
  if(k==='x')                          return [SI.left, SI.right];
  if(k==='y')                          return [SI.up, SI.down];
  if(k==='spacing')                    return [SI.in, SI.out];
  if(k==='rot')                        return [SI.rotL, SI.rotR];
  if(k==='stretch')                    return [SI.flat, SI.stretch];
  return [SI.small, SI.big];
}
/* which icon captions a colour box or a sub-category switch */
const SEC_IC = {
  'skin':IC.face, 'hair.color':IC.hair, 'brows.color':IC.brows, 'eyes.color':IC.eyes,
  'mouth.color':IC.mouth, 'beard.color':IC.beard, 'glasses.color':IC.glass,
  'body.color':SI.shirt, 'body.pants':SI.pants, 'body.shoes':SI.shoe,
  'beard.must':IC.stacheFace, 'beard.style':IC.beardFull,
  'glasses.style':IC.glassOnly, 'glasses.color':IC.glassOnly, 'hat.style':IC.hat, 'hat.color':IC.hat,
  'jewel.color':IC.earring
};
const TOG_IC = {'hair.flip':SI.flip, 'mole.on':SI.mark, 'body.dress':SI.dress};

function thumb(path, idx, view, selected){
  const t = structuredClone(M);
  set(t, path, idx);
  return `<svg viewBox="${view}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${svgMii(t, selected ? 2 : 1)}</svg>`;
}

const esc = v => String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts = (n, sel) => Array.from({length:n}, (_,i)=>
  `<option value="${i+1}"${i+1===sel?' selected':''}>${String(i+1).padStart(2,'0')}</option>`).join('');

function profileHTML(){
  return `<div class="profile">
    <div class="pf s5"><span class="lab">Nickname</span>
      <input class="field" id="pfName" maxlength="16" value="${esc(M.name)}" aria-label="Nickname"></div>

    <div class="pf s1"><span class="lab">Favorite?</span>
      <button class="field fav-btn${M.favorite?' on':''}" data-pf="favorite"
        aria-pressed="${M.favorite}" aria-label="Favorite"><span class="star">${SI.star}</span></button></div>

    <div class="pf s3"><span class="lab">Outfit</span>
      <button class="field" data-pf="outfit" aria-pressed="${M.body.dress}"
        aria-label="Outfit">${M.body.dress ? 'Dress' : 'Pants'}</button></div>

    <div class="pf s3"><span class="lab">Birthday</span>
      <div class="bday">
        <select class="field" data-pf="bm" aria-label="Birth month">${opts(12, M.birthday.m)}</select>
        <span class="slash">/</span>
        <select class="field" data-pf="bd" aria-label="Birth day">${opts(31, M.birthday.d)}</select>
      </div></div>

    <div class="pf s3"><span class="lab">Favorite Color</span>
      <div class="favgrid">${SHIRTC.map((c,i)=>
        `<button class="fav${i===M.body.color?' on':''}" data-set="body.color" data-val="${i}"
           style="background:${c}" aria-label="Favourite colour ${i+1}"></button>`).join('')}</div></div>

    <div class="pf s3 pf--fill"><span class="lab">Mingle</span>
      <button class="field" data-pf="mingle" aria-pressed="${M.mingle}" aria-label="Mingle">${M.mingle?'On':'Off'}</button></div>

    <div class="pf s6"><span class="lab">Creator</span>
      <input class="field" id="pfCreator" maxlength="16" value="${esc(M.creator)}" aria-label="Mii creator"></div>
  </div>`;
}

function activeGrids(){
  return TABS[active].sections.filter(x =>
    (x.t === 'grid' || x.t === 'multi') && (!x.when || x.when(M, sub)));
}
function syncPage(){
  const gs = activeGrids()[sub];
  page = (gs && gs.t === 'grid') ? Math.floor(get(M, gs.path) / PER_PAGE) : 0;
}

/* Preview a single piece with the rest cleared, so each tile reads on its own. */
function jewelThumb(path, view, selected){
  const t = structuredClone(M);
  JEWEL_KEYS.forEach(k => t.jewel[k] = false);
  set(t, path, true);
  t.hair.style = 0;                 // bare head, or hair hides the ears in the tile
  t.hat.style  = 0;
  return `<svg viewBox="${view}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${svgMii(t, selected ? 2 : 1)}</svg>`;
}

function drawTabs(){
  tabsEl.innerHTML = TABS.map((t,i)=>
    `<button class="tab ${i===active?'on':''}" data-tab="${i}" title="${t.label}"
       aria-label="${t.label}" aria-pressed="${i===active}">${t.icon}</button>`).join('');
}

function drawPanel(){
  const tab = TABS[active];
  if(tab.sections[0] && tab.sections[0].t === 'profile'){
    panelEl.innerHTML = `<div class="tray tray--full"><div class="tray-main">${profileHTML()}</div></div>`;
    return;
  }
  const grids = activeGrids();
  if(sub >= grids.length) sub = 0;
  let main = '', side = '';   // main = option picker (left); side = colours + sliders (right)

  if(grids.length > 1)
    main += `<div class="subs">` + grids.map((gs,i)=>
      `<button class="sub${i===sub?' on':''}" data-sub="${i}" title="${gs.title}"
         aria-label="${gs.title}">${gs.icon || SEC_IC[gs.path] || SI.small}</button>`).join('') + `</div>`;

  const gs = grids[sub];
  if(gs){
    const multi = gs.t === 'multi';
    const cur   = multi ? null : get(M, gs.path);
    const pages = Math.ceil(gs.items.length / PER_PAGE);
    if(page >= pages) page = 0;
    const start = page * PER_PAGE;
    main += `<div class="box"><div class="pager">`
      + `<button class="pg" data-page="-1" aria-label="Previous options">${chev('<path d="M15 4l-8 8 8 8"/>')}</button>`
      + `<div class="grid">`
      + gs.items.slice(start, start + PER_PAGE).map((it,k)=>{
          const i = start + k;
          if(multi){
            const on = !!get(M, it.path);
            return `<button class="tile${on?' on':''}" data-toggle="${it.path}" aria-pressed="${on}"
              title="${it.n}" aria-label="${it.n}">${jewelThumb(it.path, it.view || gs.view || tab.view, on)}</button>`;
          }
          return `<button class="tile${i===cur?' on':''}" data-set="${gs.path}" data-val="${i}"
            title="${it.n}" aria-label="${it.n}">${thumb(gs.path, i, gs.view || tab.view, i===cur)}</button>`;
        }).join('')
      + `</div>`
      + `<button class="pg" data-page="1" aria-label="Next options">${chev('<path d="M9 4l8 8-8 8"/>')}</button>`
      + `</div>`
      + `<div class="dots">` + Array.from({length: pages}, (_,d)=>
          `<span class="dot${d===page?' on':''}"></span>`).join('') + `</div></div>`;
  }

  for(const sec of tab.sections){
    if(sec.when && !sec.when(M, sub)) continue;

    if(sec.t === 'sliders'){
      side += `<div class="sliders${sec.big ? ' big' : ''}">` + sec.items.map(([path,label,min,max,step])=>{
        const v = get(M, path), pct = ((v-min)/(max-min)*100).toFixed(1), [l,r] = caps(path);
        return `<div class="slider" title="${label}">
            <span class="cap">${l}</span>
            <input type="range" min="${min}" max="${max}" step="${step}" value="${v}"
                   data-range="${path}" aria-label="${label}" style="--p:${pct}%">
            <span class="cap">${r}</span>
          </div>`;
      }).join('') + `</div>`;
    }

    if(sec.t === 'toggles'){
      side += `<div class="toggles">` + sec.items.map(([path,label])=>
        `<button class="toggle${get(M,path)?' on':''}" data-toggle="${path}"
           title="${label}" aria-label="${label}">${TOG_IC[path] || SI.mark}</button>`).join('')
        + `</div>`;
    }

    if(sec.t === 'colors'){
      const cur = get(M, sec.path);
      const custom = typeof cur === 'string';
      side += `<div class="swatches">`
           +  sec.list.map((c,i)=>
                `<button class="sw${!custom && i===cur ? ' on' : ''}" data-set="${sec.path}" data-val="${i}"
                   style="background:${c}" title="${sec.title}" aria-label="${sec.title} ${i+1}"></button>`).join('')
           +  `<label class="sw wheel${custom ? ' on' : ''}" title="${sec.title} — custom colour">
                 <input type="color" data-wheel="${sec.path}" value="${custom ? cur : pick(sec.list, cur)}"
                        aria-label="${sec.title} colour picker"></label>`
           +  `</div>`;
    }
  }

  panelEl.innerHTML = `<div class="tray${main ? '' : ' tray--full'}">`
    + (main ? `<div class="tray-main">${main}</div>` : '')
    + (side ? `<aside class="tray-side"><div class="box side-stack">${side}</div></aside>` : '')
    + `</div>`;
}

/* ---------- framing follows the tab: head for face parts, body for the rest ---------- */
const HEAD_TABS = new Set(['face','hair','brows','eyes','nose','mouth']);
const HEAD_VB = [80, 64, 352, 414];
const targetVB = () => HEAD_TABS.has(TABS[active].id)
  ? HEAD_VB.slice()
  : [56, 34, 400, bodyGeom(M).bottom - 34];
const applyVB = v => svgEl.setAttribute('viewBox', v.map(n=>Math.round(n*100)/100).join(' '));

let vbCur = null, vbRAF = 0, vbAnimating = false;
function zoomTo(animate){
  const to = targetVB();
  if(!animate || !vbCur){ vbCur = to; vbAnimating = false; applyVB(vbCur); return; }
  cancelAnimationFrame(vbRAF);
  const from = vbCur.slice(), t0 = performance.now(), DUR = 300;
  vbAnimating = true;
  const step = now => {
    const k = Math.min(1, (now - t0) / DUR);
    const e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    vbCur = from.map((v,i) => v + (to[i]-v) * e);
    applyVB(vbCur);
    if(k < 1) vbRAF = requestAnimationFrame(step); else vbAnimating = false;
  };
  vbRAF = requestAnimationFrame(step);
}

function draw(){
  uidN = 0;
  svgEl.innerHTML = svgMii(M);
  if(!vbAnimating) zoomTo(false);
  persist();
}
function drawAll(){ drawTabs(); drawPanel(); draw(); }

/* ---------- events ---------- */
tabsEl.addEventListener('click', e=>{
  const b = e.target.closest('[data-tab]'); if(!b) return;
  if(+b.dataset.tab === active) return;
  active = +b.dataset.tab; sub = 0; syncPage(); drawTabs(); drawPanel(); zoomTo(true);
});

panelEl.addEventListener('click', e=>{
  const sw = e.target.closest('[data-sub]');
  if(sw){ sub = +sw.dataset.sub; syncPage(); drawPanel(); return; }
  const pg = e.target.closest('[data-page]');
  if(pg){
    const gs = activeGrids()[sub]; if(!gs) return;
    const pages = Math.ceil(gs.items.length / PER_PAGE);
    page = (page + (+pg.dataset.page) + pages) % pages;
    drawPanel(); return;
  }
  const t = e.target.closest('[data-set]');
  if(t){ set(M, t.dataset.set, +t.dataset.val); drawPanel(); draw(); return; }
  const g = e.target.closest('[data-toggle]');
  if(g){ set(M, g.dataset.toggle, !get(M, g.dataset.toggle)); drawPanel(); draw(); return; }
  const pf = e.target.closest('[data-pf]');
  if(pf){
    const k = pf.dataset.pf;
    if(k === 'favorite') M.favorite = !M.favorite;
    if(k === 'mingle')   M.mingle   = !M.mingle;
    if(k === 'outfit')   M.body.dress = !M.body.dress;
    if(k === 'favorite' || k === 'mingle' || k === 'outfit'){ drawPanel(); draw(); }
  }
});

panelEl.addEventListener('input', e=>{
  const w = e.target.closest('[data-wheel]');
  if(w){ set(M, w.dataset.wheel, w.value); draw(); return; }
  if(e.target.id === 'pfName'){ M.name = e.target.value; persist(); return; }
  if(e.target.id === 'pfCreator'){ M.creator = e.target.value; persist(); return; }
  const r = e.target.closest('[data-range]'); if(!r) return;
  const v = +r.value;
  set(M, r.dataset.range, v);
  r.style.setProperty('--p', ((v - +r.min) / (+r.max - +r.min) * 100).toFixed(1) + '%');
  draw();
});
panelEl.addEventListener('change', e=>{
  if(e.target.closest('[data-wheel]')){ drawPanel(); return; }
  const b = e.target.closest('[data-pf]');
  if(b && b.dataset.pf === 'bm'){ M.birthday.m = +b.value; persist(); return; }
  if(b && b.dataset.pf === 'bd'){ M.birthday.d = +b.value; persist(); return; }
  if(e.target.closest('[data-range]')) drawPanel();
});

/* ---------- randomise / reset ---------- */
const ri = n => Math.floor(Math.random()*n);
const rf = (a,b) => Math.round((a + Math.random()*(b-a)) * 1000) / 1000;
$('#btnRandom').innerHTML = SI.dice;
$('#btnReset').innerHTML  = SI.undo;
$('#btnSave').innerHTML   = SI.save;

$('#btnRandom').addEventListener('click', ()=>{
  const beardy = Math.random() < .35;
  M = {
    name: M.name, creator: M.creator, favorite: M.favorite,
    mingle: M.mingle, birthday: M.birthday, skin: ri(SKINS.length),
    face   :{shape:ri(FACES.length), size:rf(.92,1.08), width:rf(.9,1.1), jaw:rf(.88,1.14)},
    hair   :{style:ri(HAIRS.length), color:ri(HAIRC.length), y:rf(-8,8), size:rf(.95,1.08), flip:Math.random()<.5},
    brows  :{style:ri(BROWS.length), color:ri(HAIRC.length), y:rf(-10,10), spacing:rf(-6,10), size:rf(.85,1.2), rot:rf(-14,14)},
    eyes   :{style:ri(EYES.length), color:ri(EYEC.length), y:rf(-10,10), spacing:rf(-6,12), size:rf(.85,1.15), stretch:rf(.85,1.15), rot:rf(-12,12)},
    nose   :{style:ri(NOSES.length), x:rf(-6,6), y:rf(-10,12), size:rf(.85,1.25), width:rf(.8,1.3)},
    mouth  :{style:ri(MOUTHS.length), color:ri(MOUTHC.length), x:rf(-6,6), y:rf(-10,14), size:rf(.85,1.15), stretch:rf(.85,1.2)},
    beard  :{must: beardy?ri(MUSTACHES.length):0, style: beardy?ri(BEARDS.length):0, color:ri(HAIRC.length), size:rf(.85,1.2), y:rf(-8,8)},
    glasses:{style: Math.random()<.35 ? 1+ri(GLASSES.length-1) : 0, color:ri(GLASSC.length), y:rf(-6,6), size:rf(.9,1.1)},
    mole   :{on: Math.random()<.18, x:rf(-120,45), y:rf(-70,60), size:rf(.8,1.4)},
    hat    :{style: Math.random()<.35 ? 1+ri(HATS.length-1) : 0, color:ri(HATC.length)},
    jewel  :Object.assign({color:0}, Object.fromEntries(JEWEL_KEYS.map(k=>[k, Math.random()<.22]))),
    body   :{color:ri(SHIRTC.length), pants:DEFAULT().body.pants, shoes:DEFAULT().body.shoes, dress:Math.random()<.4, build:rf(.86,1.16), height:rf(.9,1.1)}
  };
  drawAll();
});

$('#btnReset').addEventListener('click', ()=>{
  if(!confirm('Reset this Mii back to the default?')) return;
  const keep = {name:M.name, creator:M.creator, favorite:M.favorite, mingle:M.mingle, birthday:M.birthday};
  M = Object.assign(DEFAULT(), keep); drawAll();
});

/* ---------- export ---------- */
$('#btnSave').addEventListener('click', ()=>{
  const vb = svgEl.getAttribute('viewBox').split(' ').map(Number);
  const scale = 2.2, W = Math.round(vb[2]*scale), H = Math.round(vb[3]*scale);
  const src = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${vb.join(' ')}">${svgEl.innerHTML}</svg>`;
  const url = URL.createObjectURL(new Blob([src], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0,0,W,H);
    x.drawImage(img,0,0,W,H);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = (M.name || 'mii').replace(/[^\w\-]+/g,'_') + '.png';
    a.href = c.toDataURL('image/png'); a.click();
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); alert('Could not export this Mii.'); };
  img.src = url;
});

/* ---------- persistence ---------- */
function persist(){ try{ localStorage.setItem('mii.studio.v2', JSON.stringify(M)); }catch{} }
function restore(){
  try{
    const raw = localStorage.getItem('mii.studio.v2'); if(!raw) return;
    const saved = JSON.parse(raw), d = DEFAULT();
    for(const k in d){
      if(saved[k] == null) continue;
      M[k] = (d[k] && typeof d[k] === 'object') ? Object.assign({}, d[k], saved[k]) : saved[k];
    }
    clampIndices();
  }catch{}
}

/* A save from an older build can hold a style or colour index that no longer
   exists (the nose list shrank, for one). Pull every index back in range. */
function clampIndices(){
  const fix = (path, list) => {
    const v = get(M, path);
    if(typeof v === 'string') return;                 // a wheel colour, not an index
    set(M, path, Math.min(Math.max(0, Math.round(+v) || 0), list.length - 1));
  };
  fix('skin', SKINS);              fix('face.shape', FACES);
  fix('hair.style', HAIRS);        fix('hair.color', HAIRC);
  fix('brows.style', BROWS);       fix('brows.color', HAIRC);
  fix('eyes.style', EYES);         fix('eyes.color', EYEC);
  fix('nose.style', NOSES);
  fix('mouth.style', MOUTHS);      fix('mouth.color', MOUTHC);
  fix('beard.must', MUSTACHES);    fix('beard.style', BEARDS);   fix('beard.color', HAIRC);
  fix('glasses.style', GLASSES);   fix('glasses.color', GLASSC);
  fix('hat.style', HATS);          fix('hat.color', HATC);
  fix('jewel.color', JEWELC);
  fix('body.color', SHIRTC);       fix('body.pants', PANTSC);    fix('body.shoes', SHOEC);
}

restore();
syncPage();
drawAll();
</script>
