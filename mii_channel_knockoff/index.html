<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mii Studio — Mii Channel</title>
<style>
:root{
  --ink:#33383c;
  --rail-a:#b9c2c2; --rail-b:#96a1a1;      /* grey tab trough */
  --btn-a:#ffffff;  --btn-b:#dde2e2;        /* white plastic buttons */
  --btn-line:#7f8c8c;
  --accent:#d97a45; --accent-lt:#eda072; --accent-d:#a9521c;
  --tray:#c6d3d8; --tray-b:#b3c3c9; --tray-line:#8fa0a6;
  --tile-line:#94a3a8;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:#ccd4d4;
  color:var(--ink);
  font-family:"Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:16px 16px 40px}

/* ---------- tab rail, sitting on the content board ---------- */
.board{
  border-radius:var(--r);overflow:hidden;
  background:#eef3f4;                       /* open space the Mii stands in */
  border:1px solid #a1adae;
  box-shadow:0 7px 20px rgba(28,44,50,.17);
}
.railwrap{background:var(--rail-a);padding:0 6px;border-bottom:1px solid #97a4a4}
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 1 0;min-width:64px;height:56px;
  border-radius:0 0 10px 10px;
  display:grid;place-items:center;color:#48545a;
  background:#e4eaea;
  border:1px solid #a4afaf;border-top:none;
  transition:background .12s, color .12s;
}
.tab svg{width:32px;height:32px;stroke-width:1.8}
.tab:hover{background:#f1f5f5;color:#2f383c}
.tab.on{color:#fff;background:var(--accent);border-color:var(--accent-d)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(268px,330px) 1fr;gap:10px;padding:10px;align-items:start}
@media (max-width:880px){main{grid-template-columns:1fr}}

/* ---------- preview ---------- */
.stage{
  padding:0;position:sticky;top:16px;background:none;border:0;
}
.stage-art{
  background:none;border:0;overflow:visible;
}
#mii{display:block;width:100%;height:clamp(300px,48vh,436px)}
.stage-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.stage-bar .iconbtn{flex:none}
input.name{
  flex:1;min-width:0;padding:9px 13px;border:1px solid var(--btn-line);border-radius:9px;
  background:#fff;font-size:13px;
}
input.name:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,122,69,.3)}
.iconbtn{
  width:46px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;color:#3b4145;
  background:#f2f5f5;border:1px solid #a4afaf;
  transition:background .12s;
}
.iconbtn svg{width:25px;height:25px}
.iconbtn:hover{background:#fff}
.iconbtn:active{background:#e2e8e8}
.iconbtn.go{
  color:#fff;border-color:var(--accent-d);background:var(--accent);
}

/* ---------- options tray ---------- */
.panel{
  border-radius:var(--r);overflow:hidden;min-height:484px;
  background:var(--tray);border:1px solid #9aabb1;
  box-shadow:0 5px 14px rgba(28,44,50,.15);
}
.tray{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;padding:10px}
.tray--full{grid-template-columns:1fr}
.side-stack{display:grid;gap:11px;align-content:start}
@media (max-width:900px){.tray{grid-template-columns:1fr}}
.tray-main{min-width:0;display:grid;gap:9px}
.tray-side{min-width:0}

/* sub-category switch, as on the Wii */
.subs{display:flex;gap:6px}
.sub{
  flex:1;height:48px;border-radius:10px;display:grid;place-items:center;color:#3b4145;
  background:#f2f5f5;border:1px solid #a4afaf;transition:background .12s;
}
.sub svg{width:27px;height:27px}
.sub:hover{background:#fff}
.sub.on{color:#fff;border-color:var(--accent-d);background:var(--accent)}

.box{
  background:#e9eeee;border:1px solid #adb8b9;border-radius:10px;padding:8px;
}
.pager{display:flex;align-items:center;gap:4px}
.pager .grid{flex:none;grid-template-columns:repeat(2,104px);gap:7px}
.pg{
  flex:none;width:32px;padding:0;display:grid;place-items:center;
  background:none;border:0;box-shadow:none;color:var(--accent);
  transition:color .12s, transform .1s;
}
.pg svg{width:28px;height:28px}
.pg:hover{color:var(--accent-d);transform:scale(1.12)}
.pg:active{transform:scale(.96)}
.dots{display:flex;justify-content:center;gap:7px;margin-top:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;border:1px solid #adb8b9}
.dot.on{background:var(--accent);border-color:var(--accent-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,96px));gap:8px}
.tile{
  position:relative;aspect-ratio:1;padding:0;border-radius:9px;overflow:hidden;
  background:#fff;border:1px solid #adb8b9;
  display:grid;place-items:center;transition:border-color .12s, background .12s;
}
.tile svg{width:100%;height:100%;display:block}
.tile:hover{border-color:var(--accent)}
.tile.on{border-color:var(--accent-d);background:var(--accent)}

.sw-box{background:#fff;border:1px solid #adb8b9;border-radius:8px;padding:5px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,40px);gap:5px;justify-content:start}
.sw{
  aspect-ratio:1;border-radius:6px;border:1px solid rgba(0,0,0,.3);padding:0;
  transition:transform .1s;
}
.sw.wheel{
  position:relative;overflow:hidden;cursor:pointer;
  background:conic-gradient(#e5484d,#e2a336,#e5d94d,#5ec26a,#3aa7c9,#5b6ad4,#a457d6,#e5484d);
}
.sw.wheel input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
  opacity:0;border:0;padding:0;cursor:pointer}
.sw:hover{transform:scale(1.25)}
.sw.on{box-shadow:0 0 0 1px #fff, 0 0 0 2.5px var(--accent)}

/* ---------- icon-capped sliders ---------- */
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px 10px}
.sliders.big{grid-template-columns:1fr;gap:18px}
.sliders.big .slider{padding:22px 20px;gap:18px;border-radius:14px}
.sliders.big .cap{width:40px;height:40px;opacity:1;color:#42504f}
.sliders.big input[type=range]{height:24px;border-radius:12px}
.sliders.big input[type=range]::-webkit-slider-thumb{width:24px;height:48px;border-radius:9px}
.sliders.big input[type=range]::-moz-range-thumb{width:22px;height:46px;border-radius:9px}
.slider{
  display:flex;align-items:center;gap:12px;padding:14px 13px;border-radius:11px;
  background:#e9eeee;border:1px solid #adb8b9;
}
.slider .cap{flex:none;width:26px;height:26px;display:grid;place-items:center;color:#4d5a5e;opacity:.9}
.slider .cap svg{width:100%;height:100%}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:17px;border-radius:9px;
  background:linear-gradient(90deg, rgba(217,122,69,.38) var(--p,50%), #fff var(--p,50%));
  border:1px solid #adb8b9;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:17px;height:34px;border-radius:7px;cursor:grab;
  background:var(--accent);border:1px solid var(--accent-d);transition:transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scaleY(1.06)}
input[type=range]::-moz-range-thumb{
  width:15px;height:32px;border-radius:7px;cursor:grab;
  background:var(--accent);border:1px solid var(--accent-d);
}

/* ---------- Mii info page ---------- */
.profile{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;align-items:start}
.pf{
  border-radius:14px;padding:11px 13px 13px;
  background:#e8e6e1;border:1px solid #bab4ab;
}
.pf .lab{
  display:block;text-align:center;margin-bottom:8px;
  font-size:15px;font-weight:800;letter-spacing:.015em;color:#8b8379;
  text-shadow:0 1px 0 rgba(255,255,255,.95);
}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}
.pf--fill{align-self:stretch;display:flex;flex-direction:column}
.pf--fill .field{flex:1}
.pf--fill .fav-btn{flex:none}
@media (max-width:620px){.s1,.s2,.s3,.s4,.s5{grid-column:span 6}}
.field{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:44px;padding:9px 14px;border-radius:11px;
  font-size:18px;font-weight:700;color:#495450;text-align:center;
  background:#f4f2ee;border:1px solid #b6b0a7;
}
input.field, select.field{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
input.field:focus, select.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,122,69,.3)}
button.field{cursor:pointer;transition:filter .12s}
button.field:hover{background:#fbfaf8}
button.field:active{background:#e8e5e0}
.fav-btn{width:46px;height:46px;min-height:46px;padding:0;margin:0 auto;color:#c99a12;flex:none}
.fav-btn .star{display:grid;place-items:center;width:27px;height:27px;opacity:0;transition:opacity .12s}
.fav-btn.on .star{opacity:1}
.fav-btn svg{width:27px;height:27px}
.fav-btn.on{background:#f7e9b4;border-color:#c9b45f;color:#b8890c}
.bday{display:flex;align-items:center;gap:6px}
.bday .field{padding:7px 6px}
.bday .slash{font-weight:800;font-size:18px;color:#9a938a;flex:none}
.favgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:270px;margin:0 auto}
.fav{
  aspect-ratio:1;border-radius:5px;border:1px solid rgba(0,0,0,.3);padding:0;cursor:pointer;
  transition:transform .1s;
}
.fav:hover{transform:scale(1.12)}
.fav.on{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--accent)}

/* ---------- icon toggles ---------- */
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggle{
  width:54px;height:46px;border-radius:10px;display:grid;place-items:center;color:#3b4145;
  background:#f2f5f5;border:1px solid #a4afaf;transition:background .12s;
}
.toggle svg{width:26px;height:26px}
.toggle:hover{background:#fff}
.toggle.on{color:#fff;border-color:var(--accent-d);background:var(--accent)}

/* ---------- plaza toast ---------- */
.toast{
  margin:8px auto 0;width:fit-content;max-width:100%;
  padding:6px 12px;border-radius:999px;
  font-size:12.5px;font-weight:700;color:#fff;background:rgba(58,70,75,.9);
  opacity:0;transform:translateY(-4px);transition:opacity .18s, transform .18s;
}
.toast:empty{padding:0}
.toast.on{opacity:1;transform:none}

/* ---------- send-to-plaza panel ---------- */
.scrim{
  position:fixed;inset:0;z-index:20;display:none;place-items:center;
  background:rgba(38,48,52,.42);padding:20px;
}
.scrim.on{display:grid}
.sendcard{
  width:min(430px,100%);border-radius:16px;padding:15px 17px 17px;
  background:#eef3f4;border:1px solid #a1adae;
  box-shadow:0 12px 34px rgba(28,44,50,.3);text-align:center;
}
.sendcard h2{margin:0 0 3px;font-size:16px}
.sendcard p{margin:0 0 10px;font-size:13px;line-height:1.45;color:#667175}
.sendcard textarea{
  width:100%;height:132px;resize:vertical;padding:9px 11px;
  border:1px solid #a4afaf;border-radius:9px;background:#fff;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  line-height:1.4;color:#3b4449;white-space:pre;
}
.sendcard textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,122,69,.3)}
.sendrow{display:flex;gap:8px;margin-top:10px}
.sendrow button{
  flex:1;padding:10px 12px;border-radius:10px;font-weight:700;
  background:#f2f5f5;border:1px solid #a4afaf;transition:background .12s;
}
.sendrow button:hover{background:#fff}
.sendrow .go{color:#fff;background:var(--accent);border-color:var(--accent-d)}
.sendrow .go:hover{background:var(--accent-lt)}
</style>
</head>
<body>
<div class="app">
  <div class="board">
    <div class="railwrap"><nav class="tabs" id="tabs"></nav></div>
    <main>
    <section class="stage">
      <div class="stage-art">
        <svg id="mii" viewBox="104 74 304 348" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="stage-bar">
        <button class="iconbtn" id="btnRandom" title="Surprise me" aria-label="Surprise me"></button>
        <button class="iconbtn" id="btnReset" title="Reset" aria-label="Reset"></button>
        <button class="iconbtn" id="btnSave" title="Save PNG" aria-label="Save PNG"></button>
        <button class="iconbtn go" id="btnExport" title="Send to the Plaza"
          aria-label="Send to the Plaza"></button>
        <button class="iconbtn" id="btnPlaza" title="Go to the Plaza"
          aria-label="Go to the Plaza"></button>
      </div>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" id="panel"></section>
    </main>
  </div>
</div>
<div class="scrim" id="sendScrim" role="dialog" aria-modal="true" aria-labelledby="sendTitle">
  <div class="sendcard">
    <h2 id="sendTitle">Copied.</h2>
    <p id="sendNote">Paste this to Celine however you like — she'll add you to the Plaza.</p>
    <textarea id="sendCode" readonly spellcheck="false" aria-label="Your Mii's code"></textarea>
    <div class="sendrow">
      <button id="sendCopy">Copy again</button>
      <button id="sendDone" class="go">Done</button>
    </div>
  </div>
</div>

<script src="mii.js"></script>
<script>
let M = DEFAULT();

/* ============================================================
   TAB / PANEL CONFIG
   ============================================================ */
const ic  = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
  stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const fig = d => `<svg viewBox="0 0 24 24" fill="currentColor">${d}</svg>`;
const IC = {
  info:  ic('<path d="M20.5 4.5h-17v12h5l3.2 3.6 3.2-3.6h5.6z"/>'
           + '<circle cx="9.4" cy="10.2" r="1.15" fill="currentColor" stroke="none"/>'
           + '<circle cx="14.6" cy="10.2" r="1.15" fill="currentColor" stroke="none"/>'
           + '<path d="M9.3 13.2c1.5 1.3 4 1.3 5.4 0"/>'),
  face:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
           <ellipse cx="12" cy="12" rx="8.2" ry="9.2"/>
           <g fill="currentColor" stroke="none"><circle cx="9.2" cy="10.4" r="1.15"/><circle cx="14.8" cy="10.4" r="1.15"/></g>
           <path d="M8.6 14.9c1.6 1.8 5.2 1.8 6.8 0"/></svg>`,
  hair:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
           <ellipse cx="12" cy="12" rx="8.2" ry="9.2"/>
           <path fill="currentColor" stroke="none"
                 d="M12 2.9c-4.5 0-8.2 4.1-8.2 9.1 0 .4 0 .8.1 1.2.6-2.9 3.3-4.4 8.1-4.4s7.5 1.5 8.1 4.4c.1-.4.1-.8.1-1.2 0-5-3.7-9.1-8.2-9.1z"/></svg>`,
  brows: ic('<path d="M2.5 13c2-3.2 6-3.2 8 0M13.5 13c2-3.2 6-3.2 8 0"/>'),
  eyes:  ic('<ellipse cx="7" cy="12" rx="4.2" ry="3.2"/><ellipse cx="17" cy="12" rx="4.2" ry="3.2"/><circle cx="7" cy="12" r="1.2" fill="currentColor"/><circle cx="17" cy="12" r="1.2" fill="currentColor"/>'),
  nose:  ic('<path d="M12 4c0 4.5-3 7.5-3 10.5a3 3 0 006 0"/>'),
  mouth: ic('<path d="M4.5 10.5c2.5 6.5 12.5 6.5 15 0"/>'),
  /* combined: moustache above a full beard */
  beard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
           <ellipse cx="12" cy="12" rx="8.2" ry="9.2"/>
           <g fill="currentColor" stroke="none">
             <path d="M12 11.2c1.6-1.9 5.5-1.8 5.5 1.05 0 1.85-3.1 2.35-5.5-.2-2.4 2.55-5.5 2.05-5.5.2 0-2.85 3.9-2.95 5.5-1.05z"/>
             <path fill-rule="evenodd" d="M4.9 13.1C5.4 17.9 8.4 21.2 12 21.2
               C15.6 21.2 18.6 17.9 19.1 13.1 C17.6 15.6 15.1 16.6 12 16.6
               C8.9 16.6 6.4 15.6 4.9 13.1 Z
               M9.6 18.4 a2.4 1.1 0 1 0 4.8 0 a2.4 1.1 0 1 0 -4.8 0 Z"/>
           </g></svg>`,
  /* full beard, the iconic one */
  beardFull: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
           <ellipse cx="12" cy="12" rx="8.2" ry="9.2"/>
           <path fill="currentColor" stroke="none" fill-rule="evenodd"
                 d="M4.1 9.7 C4.0 15.7 7.5 21.2 12 21.2 C16.5 21.2 20.0 15.7 19.9 9.7
                    C19.3 13.5 16.1 15.0 12 15.0 C7.9 15.0 4.7 13.5 4.1 9.7 Z
                    M9.2 17.3 a2.8 1.2 0 1 0 5.6 0 a2.8 1.2 0 1 0 -5.6 0 Z"/></svg>`,
  /* moustache, sat on the face rather than floating */
  stacheFace: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
           <ellipse cx="12" cy="12" rx="8.2" ry="9.2"/>
           <path d="M9.4 17c1.3 1.1 3.9 1.1 5.2 0"/>
           <path fill="currentColor" stroke="none"
                 d="M12 12c1.6-1.9 5.6-1.8 5.6 1.05 0 1.9-3.15 2.4-5.6-.2-2.45 2.6-5.6 2.1-5.6.2C6.4 10.2 10.4 10.1 12 12z"/></svg>`,
  glass: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
           <g fill="currentColor" stroke="none">
             <path d="M12 2.4c-3.5 0-6 2.3-6 5.8v1.7h12V8.2c0-3.5-2.5-5.8-6-5.8z"/>
             <rect x="2.6" y="10.4" width="18.8" height="2.7" rx="1.35"/>
           </g>
           <circle cx="7.1" cy="18" r="3.3"/><circle cx="16.9" cy="18" r="3.3"/>
           <path d="M10.4 17.6h3.2"/></svg>`,
  earring: ic('<circle cx="12" cy="5.6" r="2.1" fill="currentColor" stroke="none"/>'
           + '<circle cx="12" cy="14.6" r="5.6"/>'),
  hat:   fig('<path d="M12 3c-3.7 0-6.4 2.5-6.4 6.3v2.6h12.8V9.3C18.4 5.5 15.7 3 12 3z"/>'
           + '<rect x="2.4" y="12.6" width="19.2" height="3.1" rx="1.55"/>'),
  glassOnly: ic('<circle cx="6.7" cy="13.5" r="4.3"/><circle cx="17.3" cy="13.5" r="4.3"/>'
           + '<path d="M11 13h2M2.4 10.8L4.6 8.8M21.6 10.8L19.4 8.8"/>'),
  body:  fig('<circle cx="12" cy="4.4" r="3.3"/>'
           + '<rect x="8.5" y="8.6" width="7" height="7.6" rx="2.6"/>'
           + '<rect x="9.1" y="15.8" width="2.6" height="4.8" rx="1.3"/>'
           + '<rect x="12.3" y="15.8" width="2.6" height="4.8" rx="1.3"/>')
};

const TABS = [
 {id:'profile', label:'Mii Info', icon:IC.info, view:'56 34 400 700', sections:[{t:'profile'}]},
 {id:'body', label:'Body', icon:IC.body, view:'56 34 400 700', sections:[
   {t:'sliders', big:true, items:[['body.build','Build — narrow to wide',.78,1.28,.005,'pct']]},
   {t:'sliders', big:true, items:[['body.height','Height — short to tall',.8,1.2,.005,'pct']]}
 ]},
 {id:'face', label:'Face', icon:IC.face, view:'116 84 280 348', sections:[
   {t:'grid',   title:'Face Shape', path:'face.shape', items:FACES},
   {t:'colors', title:'Skin Tone',  path:'skin', list:SKINS},
   {t:'sliders',title:'Proportions', items:[
     ['face.size','Overall Size',.86,1.14,.005,'pct'],
     ['face.width','Width',.86,1.16,.005,'pct'],
     ['face.jaw','Jaw Width',.82,1.2,.005,'pct']]}
 ]},
 {id:'hair', label:'Hair', icon:IC.hair, view:'70 30 372 448', sections:[
   {t:'grid',   title:'Hair Style', path:'hair.style', items:HAIRS},
   {t:'colors', title:'Hair Colour', path:'hair.color', list:HAIRC},

/* slider end-caps are derived from what the slider actually does */
function caps(path){
  if(path === 'body.build')  return [SI.figThin, SI.figWide];
  if(path === 'body.height') return [SI.figShort, SI.figTall];
  if(path === 'face.width')  return [SI.browNarrow, SI.browWide];   // skull width at the brow
  if(path === 'face.jaw')    return [SI.jawNarrow, SI.jawWide];
  if(path === 'nose.width')  return [SI.noseNarrow, SI.noseWide];
  const k = path.split('.').pop();
  if(k==='size')                       return [SI.small, SI.big];
  if(k==='width'||k==='jaw'||k==='build') return [SI.narrow, SI.wide];
  if(k==='height')                     return [SI.squat, SI.tall];
  if(k==='x')                          return [SI.left, SI.right];
  if(k==='y')                          return [SI.up, SI.down];
  if(k==='spacing')                    return [SI.in, SI.out];
  if(k==='rot')                        return [SI.rotL, SI.rotR];
  if(k==='stretch')                    return [SI.flat, SI.stretch];
  return [SI.small, SI.big];
}

/* Preview a single piece with the rest cleared, so each tile reads on its own. */
function jewelThumb(path, view, selected){
  const t = structuredClone(M);
  JEWEL_KEYS.forEach(k => t.jewel[k] = false);
  set(t, path, true);
  t.hair.style = 0;                 // bare head, or hair hides the ears in the tile
  t.hat.style  = 0;
  return `<svg viewBox="${view}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${svgMii(t, selected ? 2 : 1)}</svg>`;

function drawPanel(){
  const tab = TABS[active];
  if(tab.sections[0] && tab.sections[0].t === 'profile'){
    panelEl.innerHTML = `<div class="tray tray--full"><div class="tray-main">${profileHTML()}</div></div>`;
    return;
  }
  const grids = activeGrids();
  if(sub >= grids.length) sub = 0;
  let main = '', side = '';   // main = option picker (left); side = colours + sliders (right)

  if(grids.length > 1)
    main += `<div class="subs">` + grids.map((gs,i)=>
      `<button class="sub${i===sub?' on':''}" data-sub="${i}" title="${gs.title}"
         aria-label="${gs.title}">${gs.icon || SEC_IC[gs.path] || SI.small}</button>`).join('') + `</div>`;

  const gs = grids[sub];
  if(gs){
    const multi = gs.t === 'multi';
    const cur   = multi ? null : get(M, gs.path);
    const pages = Math.ceil(gs.items.length / PER_PAGE);
    if(page >= pages) page = 0;
    const start = page * PER_PAGE;
    main += `<div class="box"><div class="pager">`
      + `<button class="pg" data-page="-1" aria-label="Previous options">${chev('<path d="M15 4l-8 8 8 8"/>')}</button>`
      + `<div class="grid">`
      + gs.items.slice(start, start + PER_PAGE).map((it,k)=>{
          const i = start + k;
          if(multi){
            const on = !!get(M, it.path);
            return `<button class="tile${on?' on':''}" data-toggle="${it.path}" aria-pressed="${on}"
              title="${it.n}" aria-label="${it.n}">${jewelThumb(it.path, it.view || gs.view || tab.view, on)}</button>`;
          }
          return `<button class="tile${i===cur?' on':''}" data-set="${gs.path}" data-val="${i}"
            title="${it.n}" aria-label="${it.n}">${thumb(gs.path, i, gs.view || tab.view, i===cur)}</button>`;
        }).join('')
      + `</div>`
      + `<button class="pg" data-page="1" aria-label="Next options">${chev('<path d="M9 4l8 8-8 8"/>')}</button>`
      + `</div>`
      + `<div class="dots">` + Array.from({length: pages}, (_,d)=>
          `<span class="dot${d===page?' on':''}"></span>`).join('') + `</div></div>`;
  }

  for(const sec of tab.sections){
    if(sec.when && !sec.when(M, sub)) continue;

    if(sec.t === 'sliders'){
      side += `<div class="sliders${sec.big ? ' big' : ''}">` + sec.items.map(([path,label,min,max,step])=>{
        const v = get(M, path), pct = ((v-min)/(max-min)*100).toFixed(1), [l,r] = caps(path);
        return `<div class="slider" title="${label}">
            <span class="cap">${l}</span>
            <input type="range" min="${min}" max="${max}" step="${step}" value="${v}"
                   data-range="${path}" aria-label="${label}" style="--p:${pct}%">
            <span class="cap">${r}</span>
          </div>`;
      }).join('') + `</div>`;
    }

    if(sec.t === 'toggles'){
      side += `<div class="toggles">` + sec.items.map(([path,label])=>
        `<button class="toggle${get(M,path)?' on':''}" data-toggle="${path}"
           title="${label}" aria-label="${label}">${TOG_IC[path] || SI.mark}</button>`).join('')
        + `</div>`;
    }

    if(sec.t === 'colors'){
      const cur = get(M, sec.path);
      const custom = typeof cur === 'string';
      side += `<div class="swatches">`
           +  sec.list.map((c,i)=>
                `<button class="sw${!custom && i===cur ? ' on' : ''}" data-set="${sec.path}" data-val="${i}"
                   style="background:${c}" title="${sec.title}" aria-label="${sec.title} ${i+1}"></button>`).join('')
           +  `<label class="sw wheel${custom ? ' on' : ''}" title="${sec.title} — custom colour">
                 <input type="color" data-wheel="${sec.path}" value="${custom ? cur : pick(sec.list, cur)}"
                        aria-label="${sec.title} colour picker"></label>`
           +  `</div>`;
    }
  }

  panelEl.innerHTML = `<div class="tray${main ? '' : ' tray--full'}">`
    + (main ? `<div class="tray-main">${main}</div>` : '')
    + (side ? `<aside class="tray-side"><div class="box side-stack">${side}</div></aside>` : '')
    + `</div>`;
}

/* ---------- framing follows the tab: head for face parts, body for the rest ---------- */
const HEAD_TABS = new Set(['face','hair','brows','eyes','nose','mouth']);
const HEAD_VB = [80, 64, 352, 414];
const targetVB = () => HEAD_TABS.has(TABS[active].id)
  ? HEAD_VB.slice()
  : [56, 34, 400, bodyGeom(M).bottom - 34];
const applyVB = v => svgEl.setAttribute('viewBox', v.map(n=>Math.round(n*100)/100).join(' '));

let vbCur = null, vbRAF = 0, vbAnimating = false;
function zoomTo(animate){
  const to = targetVB();
  if(!animate || !vbCur){ vbCur = to; vbAnimating = false; applyVB(vbCur); return; }
  cancelAnimationFrame(vbRAF);
  const from = vbCur.slice(), t0 = performance.now(), DUR = 300;
  vbAnimating = true;
  const step = now => {
    const k = Math.min(1, (now - t0) / DUR);
    const e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
    vbCur = from.map((v,i) => v + (to[i]-v) * e);
    applyVB(vbCur);
    if(k < 1) vbRAF = requestAnimationFrame(step); else vbAnimating = false;
  };
  vbRAF = requestAnimationFrame(step);
}

  uidN = 0;
  svgEl.innerHTML = svgMii(M);
  if(!vbAnimating) zoomTo(false);
  persist();
}
function drawAll(){ drawTabs(); drawPanel(); draw(); }

/* ---------- events ---------- */
tabsEl.addEventListener('click', e=>{
  const b = e.target.closest('[data-tab]'); if(!b) return;
  if(+b.dataset.tab === active) return;
  active = +b.dataset.tab; sub = 0; syncPage(); drawTabs(); drawPanel(); zoomTo(true);
});

panelEl.addEventListener('click', e=>{
  const sw = e.target.closest('[data-sub]');
  if(sw){ sub = +sw.dataset.sub; syncPage(); drawPanel(); return; }
  const pg = e.target.closest('[data-page]');
  if(pg){
    const gs = activeGrids()[sub]; if(!gs) return;
    const pages = Math.ceil(gs.items.length / PER_PAGE);
    page = (page + (+pg.dataset.page) + pages) % pages;
    drawPanel(); return;
  }
  const t = e.target.closest('[data-set]');
  if(t){ set(M, t.dataset.set, +t.dataset.val); drawPanel(); draw(); return; }
  const g = e.target.closest('[data-toggle]');
  if(g){ set(M, g.dataset.toggle, !get(M, g.dataset.toggle)); drawPanel(); draw(); return; }
  const pf = e.target.closest('[data-pf]');
  if(pf){
    const k = pf.dataset.pf;
    if(k === 'favorite') M.favorite = !M.favorite;
    if(k === 'mingle')   M.mingle   = !M.mingle;
    if(k === 'outfit')   M.body.dress = !M.body.dress;
    if(k === 'favorite' || k === 'mingle' || k === 'outfit'){ drawPanel(); draw(); }
  }
});

panelEl.addEventListener('input', e=>{
  const w = e.target.closest('[data-wheel]');
  if(w){ set(M, w.dataset.wheel, w.value); draw(); return; }
  if(e.target.id === 'pfName'){ M.name = e.target.value; persist(); return; }
  const r = e.target.closest('[data-range]'); if(!r) return;
  const v = +r.value;
  set(M, r.dataset.range, v);
  r.style.setProperty('--p', ((v - +r.min) / (+r.max - +r.min) * 100).toFixed(1) + '%');
  draw();
});
panelEl.addEventListener('change', e=>{
  if(e.target.closest('[data-wheel]')){ drawPanel(); return; }
  const b = e.target.closest('[data-pf]');
  if(b && b.dataset.pf === 'bm'){ M.birthday.m = +b.value; persist(); return; }
  if(b && b.dataset.pf === 'bd'){ M.birthday.d = +b.value; persist(); return; }
  if(e.target.closest('[data-range]')) drawPanel();
});

/* ---------- randomise / reset ---------- */
const ri = n => Math.floor(Math.random()*n);
const rf = (a,b) => Math.round((a + Math.random()*(b-a)) * 1000) / 1000;
$('#btnRandom').innerHTML = SI.dice;
$('#btnReset').innerHTML  = SI.undo;
$('#btnSave').innerHTML   = SI.save;
$('#btnExport').innerHTML = SI.send;
$('#btnPlaza').innerHTML  = SI.people;

/* ---------- plaza ---------- */
let toastT = 0;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('on'), 2600);
}

/* Sending a Mii over drops them into this browser's plaza straight away and
   hands back their code. Copying can fail — an insecure origin, an old browser,
   a denied permission — so the code is always shown as selectable text too. */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch{ return false; }
}
function showSend(name, code, copied){
  $('#sendTitle').textContent = copied ? 'Copied.' : `${name} is ready to send.`;
  $('#sendNote').textContent  = copied
    ? "Paste this to Celine however you like — she'll add you to the Plaza."
    : "Copy this and send it to Celine however you like — she'll add you to the Plaza.";
  const box = $('#sendCode');
  box.value = code;
  $('#sendScrim').classList.add('on');
  box.focus(); box.select();
  box.scrollTop = 0;                 // select() lands at the end; show the start
}
function hideSend(){ $('#sendScrim').classList.remove('on'); }

$('#btnExport').addEventListener('click', async ()=>{
  if(!M.mingle){ toast('Turn Mingle on in Mii Info first.'); return; }
  const r = rosterAdd(M);
  if(r.reason === 'noname')    return toast('Give this Mii a nickname first.');
  if(r.reason === 'resident')  return toast(`“${r.name}” already lives in the Plaza.`);
  if(r.reason === 'duplicate') return toast(`“${r.name}” is already in your Plaza.`);
  const code = submissionCode(M);
  toast(`${r.name} joined your Plaza.`);
  showSend(r.name, code, await copyText(code));
});

$('#sendCopy').addEventListener('click', async ()=>{
  const box = $('#sendCode');
  box.focus(); box.select();
  $('#sendCopy').textContent = await copyText(box.value) ? 'Copied' : 'Press ⌘C';
  setTimeout(()=>{ $('#sendCopy').textContent = 'Copy again'; }, 1800);
});
$('#sendDone').addEventListener('click', hideSend);
$('#sendScrim').addEventListener('click', e=>{ if(e.target === $('#sendScrim')) hideSend(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') hideSend(); });
$('#btnPlaza').addEventListener('click', ()=>{ location.href = 'plaza.html'; });

$('#btnRandom').addEventListener('click', ()=>{
  const keep = {name:M.name, favorite:M.favorite,
                mingle:M.mingle, birthday:M.birthday};
  M = Object.assign(randomMii(), keep);
  M.body.pants = DEFAULT().body.pants;
  M.body.shoes = DEFAULT().body.shoes;
  drawAll();
});

$('#btnReset').addEventListener('click', ()=>{
  if(!confirm('Reset this Mii back to the default?')) return;
  const keep = {name:M.name, favorite:M.favorite, mingle:M.mingle, birthday:M.birthday};
  M = Object.assign(DEFAULT(), keep); drawAll();
});

/* ---------- export ---------- */
$('#btnSave').addEventListener('click', ()=>{
  const vb = svgEl.getAttribute('viewBox').split(' ').map(Number);
  const scale = 2.2, W = Math.round(vb[2]*scale), H = Math.round(vb[3]*scale);
  const src = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${vb.join(' ')}">${svgEl.innerHTML}</svg>`;
  const url = URL.createObjectURL(new Blob([src], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0,0,W,H);
    x.drawImage(img,0,0,W,H);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = (M.name || 'mii').replace(/[^\w\-]+/g,'_') + '.png';
    a.href = c.toDataURL('image/png'); a.click();
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); alert('Could not export this Mii.'); };
  img.src = url;
});

/* ---------- persistence ---------- */
function persist(){ try{ localStorage.setItem('mii.studio.v2', JSON.stringify(M)); }catch{} }
function restore(){
  try{
    const raw = localStorage.getItem('mii.studio.v2'); if(!raw) return;
    const saved = JSON.parse(raw), d = DEFAULT();
    for(const k in d){
      if(saved[k] == null) continue;
      M[k] = (d[k] && typeof d[k] === 'object') ? Object.assign({}, d[k], saved[k]) : saved[k];
    }
    clampIndices();
  }catch{}
}

/* A save from an older build can hold a style or colour index that no longer
   exists (the nose list shrank, for one). Pull every index back in range. */
function clampIndices(){
  const fix = (path, list) => {
    const v = get(M, path);
    if(typeof v === 'string') return;                 // a wheel colour, not an index
    set(M, path, Math.min(Math.max(0, Math.round(+v) || 0), list.length - 1));
  };
  fix('skin', SKINS);              fix('face.shape', FACES);
  fix('hair.style', HAIRS);        fix('hair.color', HAIRC);
  fix('brows.style', BROWS);       fix('brows.color', HAIRC);
  fix('eyes.style', EYES);         fix('eyes.color', EYEC);
  fix('nose.style', NOSES);
  fix('mouth.style', MOUTHS);      fix('mouth.color', MOUTHC);
  fix('beard.must', MUSTACHES);    fix('beard.style', BEARDS);   fix('beard.color', HAIRC);
  fix('glasses.style', GLASSES);   fix('glasses.color', GLASSC);
  fix('hat.style', HATS);          fix('hat.color', HATC);
  fix('jewel.color', JEWELC);
  fix('body.color', SHIRTC);       fix('body.pants', PANTSC);    fix('body.shoes', SHOEC);
}

restore();
syncPage();
drawAll();
loadCommitted();          // so a nickname a resident already holds is refused
</script>
